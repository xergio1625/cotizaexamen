<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Una lupa recorre una lista de precios borrosa y deja ver los valores con claridad">
<style>
.bg{fill:#f1f5ee}.t{font:700 22px system-ui,sans-serif;fill:#2f4638}.l{font:600 18px system-ui,sans-serif;fill:#24332a}.m{font:14px system-ui,sans-serif;fill:#566459}
.blur{filter:url(#b);opacity:.85}
.sharp{opacity:0}
.r1{animation:a1 12s ease-in-out infinite}.r2{animation:a2 12s ease-in-out infinite}.r3{animation:a3 12s ease-in-out infinite}.r4{animation:a4 12s ease-in-out infinite}
@keyframes a1{0%,6%{opacity:0}14%,94%{opacity:1}100%{opacity:0}}
@keyframes a2{0%,30%{opacity:0}38%,94%{opacity:1}100%{opacity:0}}
@keyframes a3{0%,54%{opacity:0}62%,94%{opacity:1}100%{opacity:0}}
@keyframes a4{0%,76%{opacity:0}84%,94%{opacity:1}100%{opacity:0}}
.lupa{animation:mv 12s ease-in-out infinite}
@keyframes mv{0%,22%{transform:translate(0,0)}30%,47%{transform:translate(0,64px)}55%,72%{transform:translate(0,128px)}80%,92%{transform:translate(0,192px)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.sharp{opacity:1}.blur{display:none}}
</style>
<defs>
<filter id="b" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect class="bg" width="800" height="360"/>
<text class="t" x="400" y="40" text-anchor="middle">Precios a la vista</text>
<g transform="translate(120 70)">
<g class="blur">
<rect x="0" y="0" width="560" height="52" rx="10" fill="#fff"/><text class="l" x="24" y="33">Examen A</text><text class="l" x="536" y="33" text-anchor="end">$ 4.900</text>
<rect x="0" y="64" width="560" height="52" rx="10" fill="#fff"/><text class="l" x="24" y="97">Examen B</text><text class="l" x="536" y="97" text-anchor="end">$ 12.300</text>
<rect x="0" y="128" width="560" height="52" rx="10" fill="#fff"/><text class="l" x="24" y="161">Examen C</text><text class="l" x="536" y="161" text-anchor="end">$ 7.150</text>
<rect x="0" y="192" width="560" height="52" rx="10" fill="#fff"/><text class="l" x="24" y="225">Examen D</text><text class="l" x="536" y="225" text-anchor="end">$ 3.600</text>
</g>
<g class="sharp r1"><rect x="0" y="0" width="560" height="52" rx="10" fill="#fff" stroke="#9bb5a3" stroke-width="2"/><text class="l" x="24" y="33">Examen A</text><text class="l" x="536" y="33" text-anchor="end">$ 4.900</text></g>
<g class="sharp r2"><rect x="0" y="64" width="560" height="52" rx="10" fill="#fff" stroke="#9bb5a3" stroke-width="2"/><text class="l" x="24" y="97">Examen B</text><text class="l" x="536" y="97" text-anchor="end">$ 12.300</text></g>
<g class="sharp r3"><rect x="0" y="128" width="560" height="52" rx="10" fill="#fff" stroke="#9bb5a3" stroke-width="2"/><text class="l" x="24" y="161">Examen C</text><text class="l" x="536" y="161" text-anchor="end">$ 7.150</text></g>
<g class="sharp r4"><rect x="0" y="192" width="560" height="52" rx="10" fill="#fff" stroke="#9bb5a3" stroke-width="2"/><text class="l" x="24" y="225">Examen D</text><text class="l" x="536" y="225" text-anchor="end">$ 3.600</text></g>
</g>
<g transform="translate(590 96)"><g class="lupa"><circle r="32" fill="rgba(255,255,255,.25)" stroke="#4f6f5c" stroke-width="7"/><line x1="23" y1="23" x2="58" y2="58" stroke="#2f4638" stroke-width="10" stroke-linecap="round"/></g></g>
<text class="m" x="400" y="340" text-anchor="middle">Un precio publicado con fuente y fecha se puede comparar.</text>
</svg>

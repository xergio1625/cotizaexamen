<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Un camión lleva un tubo de muestra de una ciudad a otra mientras un reloj corre: algunas muestras toleran el viaje y otras no">
<style>
.bg{fill:#f1f5ee}.t{font:700 17px system-ui,sans-serif;fill:#2f4638}.m{font:13px system-ui,sans-serif;fill:#566459}
.truck{animation:tr 9s ease-in-out infinite}
@keyframes tr{0%{transform:translateX(-10px)}85%,100%{transform:translateX(360px)}}
.road{stroke-dasharray:22 16;animation:rd 1s linear infinite}
@keyframes rd{to{stroke-dashoffset:-38}}
.liq{animation:lq 9s ease-in-out infinite}
@keyframes lq{0%{fill:#c9806a}60%{fill:#c9806a}100%{fill:#9a6a5a}}
.hand{transform-origin:110px 70px;animation:hd 9s linear infinite}
@keyframes hd{from{transform:rotate(0)}to{transform:rotate(300deg)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:wh .8s linear infinite}
@keyframes wh{to{transform:rotate(360deg)}}
.ok{animation:ok 9s ease-in-out infinite}
@keyframes ok{0%,80%{opacity:0}92%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ok{opacity:1}}
</style>
<rect class="bg" width="800" height="360"/>
<g transform="translate(70 60)"><circle cx="0" cy="190" r="0"/><rect x="-30" y="110" width="12" height="90" fill="#9bb5a3"/><rect x="-14" y="80" width="14" height="120" fill="#6f8f7a"/><rect x="2" y="124" width="12" height="76" fill="#9bb5a3"/></g>
<g transform="translate(700 60)"><rect x="-30" y="80" width="14" height="120" fill="#6f8f7a"/><rect x="-14" y="52" width="14" height="148" fill="#4f6f5c"/><rect x="2" y="100" width="12" height="100" fill="#9bb5a3"/></g>
<text class="t" x="70" y="276" text-anchor="middle">Tu ciudad</text><text class="t" x="700" y="276" text-anchor="middle">Laboratorio central</text>
<line x1="30" y1="260" x2="770" y2="260" stroke="#9bb5a3" stroke-width="4"/><line class="road" x1="30" y1="260" x2="770" y2="260" stroke="#fff" stroke-width="4"/>
<g class="truck"><rect x="150" y="196" width="90" height="52" rx="8" fill="#fff" stroke="#4f6f5c" stroke-width="4"/><path d="M240 210 h28 l16 20 v18 h-44z" fill="#fff" stroke="#4f6f5c" stroke-width="4" stroke-linejoin="round"/>
<rect x="176" y="150" width="14" height="50" rx="4" fill="#fff" stroke="#4f6f5c" stroke-width="3"/><rect class="liq" x="179" y="168" width="8" height="28" rx="2"/><rect x="174" y="144" width="18" height="8" rx="3" fill="#2f4638"/>
<g class="wheel"><circle cx="176" cy="254" r="12" fill="#2f4638"/><path d="M176 244 v20" stroke="#fff" stroke-width="3"/></g><g class="wheel"><circle cx="262" cy="254" r="12" fill="#2f4638"/><path d="M262 244 v20" stroke="#fff" stroke-width="3"/></g></g>
<g><circle cx="110" cy="70" r="34" fill="#fff" stroke="#4f6f5c" stroke-width="5"/><g class="hand"><line x1="110" y1="70" x2="110" y2="46" stroke="#c9806a" stroke-width="4" stroke-linecap="round"/></g><circle cx="110" cy="70" r="4" fill="#2f4638"/></g>
<text class="m" x="110" y="124" text-anchor="middle">El tiempo cuenta</text>
<g class="ok"><rect x="280" y="64" width="290" height="40" rx="20" fill="#e6f0e3" stroke="#4f6f5c" stroke-width="3"/><text class="t" x="425" y="90" text-anchor="middle">¿La muestra aguanta el viaje?</text></g>
</svg>

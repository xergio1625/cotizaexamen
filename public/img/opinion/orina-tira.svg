<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Una vejiga que se llena durante 4 horas y una tira reactiva con casillas de colores que cambian">
<style>
.bg{fill:#f1f5ee}.t{font:700 20px system-ui,sans-serif;fill:#2f4638}.m{font:14px system-ui,sans-serif;fill:#566459}.l{font:600 15px system-ui,sans-serif;fill:#24332a}
.lvl{transform-box:fill-box;transform-origin:50% 100%;animation:fill 8s ease-in-out infinite}
@keyframes fill{0%{transform:scaleY(.15)}85%,100%{transform:scaleY(1)}}
.hand{transform-origin:200px 105px;animation:r 8s linear infinite}
@keyframes r{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.p1{animation:c1 8s ease-in-out infinite}.p2{animation:c2 8s ease-in-out infinite}.p3{animation:c3 8s ease-in-out infinite}
@keyframes c1{0%,40%{fill:#e8e2b8}85%,100%{fill:#d99a85}}
@keyframes c2{0%,60%{fill:#dbe7c8}85%,100%{fill:#b98fb0}}
@keyframes c3{0%,20%{fill:#f4eec2}85%,100%{fill:#8fb8cf}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="bg" width="800" height="360"/>
<circle cx="200" cy="105" r="34" fill="#fff" stroke="#4f6f5c" stroke-width="5"/>
<g class="hand"><line x1="200" y1="105" x2="200" y2="80" stroke="#c9806a" stroke-width="5" stroke-linecap="round"/></g>
<circle cx="200" cy="105" r="6" fill="#2f4638"/>
<text class="l" x="248" y="112">4 a 5 horas</text>
<path d="M160 170 q40 -34 80 0 q34 70 -40 120 q-74 -50 -40 -120z" fill="#fff" stroke="#4f6f5c" stroke-width="5" stroke-linejoin="round"/>
<clipPath id="v"><path d="M164 176 q36 -28 72 0 q30 64 -36 108 q-66 -44 -36 -108z"/></clipPath>
<g clip-path="url(#v)"><rect class="lvl" x="150" y="170" width="100" height="125" fill="#f3dc8a"/></g>
<text class="t" x="200" y="330" text-anchor="middle">Vejiga: la orina «madura»</text>
<g transform="translate(470 54)">
<rect x="0" y="0" width="60" height="250" rx="10" fill="#fff" stroke="#4f6f5c" stroke-width="4"/>
<rect class="p1" x="10" y="18" width="40" height="30" rx="5" fill="#d99a85"/>
<rect class="p2" x="10" y="62" width="40" height="30" rx="5" fill="#b98fb0"/>
<rect class="p3" x="10" y="106" width="40" height="30" rx="5" fill="#8fb8cf"/>
<rect x="10" y="150" width="40" height="30" rx="5" fill="#dde8db"/>
<rect x="10" y="194" width="40" height="30" rx="5" fill="#e9eddf"/>
<text class="m" x="86" y="38">Nitritos</text>
<text class="m" x="86" y="82">Leucocitos</text>
<text class="m" x="86" y="126">Sangre</text>
<text class="m" x="86" y="170">Glucosa</text>
<text class="m" x="86" y="214">Proteínas</text>
</g>
<text class="t" x="560" y="330" text-anchor="middle">Tira: un tamizaje, no un diagnóstico</text>
</svg>
